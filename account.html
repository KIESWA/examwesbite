<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account – Greenfield Local Hub</title>
    <link rel="stylesheet" href="CSS.css">
</head>
<body>

<div class="header">
    <h1>Greenfield Local Hub</h1>
    <div class="cart" id="cart">🛒 <span id="cart-count">0</span> items (<span id="cart-total">0.00</span>)</div>
</div>

<nav id="main-nav"></nav>
    
<div id="cart-sidebar" class="cart-sidebar">
    <div class="cart-header">
        <h2>Your Cart</h2>
        <button id="close-cart">✖</button>
    </div>

    <div id="cart-items"></div>

    <div class="cart-footer">
        <p>Total: <span id="sidebar-total">0.00</span></p>
    </div>
</div>

<section id="account-info">
    <h2>Account Settings</h2>
    <form id="account-settings-form">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Your Name">

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="you@example.com">

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="New Password">

        <label for="address">Delivery Address:</label>
        <input type="text" id="address" placeholder="123 Green Street">

        <button type="submit">Save Changes</button>
        <button type="button" id="delete-account">Delete Account</button>
    </form>
</section>

<section id="rewards">
    <h2>Rewards Points</h2>
    <p>You have <span id="reward-points">0</span> points!</p>
</section>

<section id="orders">
    <h2>Your Orders</h2>
    <table id="orders-table">
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Items</th>
                <th>Total (£)</th>
                <th>Status</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            <!--  Orders done here script.js -->
        </tbody>
    </table>
</section>


    <footer id="main-footer"></footer>

<button id="accessibility-btn">⚙️</button>
<div id="accessibility-panel">
    <button id="increase-font">Increase Font</button>
    <button id="decrease-font">Decrease Font</button>
    <button id="change-font">Change Font</button>
    <button id="change-color">Change Text Color</button>
    <button id="change-contrast">Change Contrast</button>
</div>

<script src="script.js"></script>

</body>
</html>
