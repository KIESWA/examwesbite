<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact – Greenfield Local Hub</title>
    <link rel="stylesheet" href="CSS.css">
</head>

<body>

    <div class="header">
        <h1>Greenfield Local Hub</h1>

        <div class="cart" id="cart">
            🛒 <span id="cart-count">0</span> items (<span id="cart-total">0.00</span>)
        </div>
    </div>


    <nav id="main-nav"></nav>


    <div class="page-content">

        <h2>Contact Us</h2>

        <p>
            Have a question, issue, or want to partner with us?  
            Send us a message and we’ll get back to you as soon as possible.
        </p>


        <form id="contact-form">

            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Your email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" placeholder="Subject" required>

            <label for="message">Message</label>
            <textarea id="message" rows="6" placeholder="Write your message..." required></textarea>

            <button type="submit">Send Message</button>

        </form>

        <div id="form-status"></div>

        <h3>Other Ways to Reach Us</h3>

        <p>
            📧 Email: support@greenfieldlocalhub.com<br>
            📍 Location: Local Farmers Market Network<br>
            📞 Phone: 01234 567890
        </p>

    </div>

    <footer id="main-footer"></footer>

    <script src="script.js"></script>

    <script>
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const status = document.getElementById('form-status');
            status.textContent = "Message sent successfully!";
            status.style.color = "green";

            this.reset();
        });
    </script>

</body>
</html>
