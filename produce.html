<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Produce – Greenfield Local Hub</title>
    <link rel="stylesheet" href="CSS.css">
</head>
<body>
<div class="header">
    <h1>Greenfield Local Hub</h1>
    <div class="cart" id="cart">🛒 <span id="cart-count">0</span> items (<span id="cart-total">0.00</span>)</div>
</div>

<nav id="main-nav"></nav>
    
<div id="cart-sidebar" class="cart-sidebar">
    <div class="cart-header">
        <h2>Your Cart</h2>
        <button id="close-cart">✖</button>
    </div>

    <div id="cart-items"></div>

    <div class="cart-footer">
        <p>Total: <span id="sidebar-total">0.00</span></p>
    </div>
</div>
<h2 class="info-text">All Produce</h2>
<div class="container" id="produce-container"></div>

    <footer id="main-footer"></footer>

<button id="accessibility-btn">⚙️</button>
<div id="accessibility-panel" style="display:none;">
    <button id="increase-font">Increase Font</button>
    <button id="decrease-font">Decrease Font</button>
    <button id="change-font">Change Font</button>
    <button id="change-color">Change Text Color</button>
    <button id="change-contrast">Change Contrast</button>
</div>

<script src="script.js"></script>
</body>
</html>
